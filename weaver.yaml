# Mantle Workspace
# Compose platform dependencies + product services

sources:
  # Platform metarepos - each has its own weaver.yaml
  # Paths from sources are automatically rebased relative to source location
  - path: ../hidra/weaver.yaml
    tags: [platform, hidra]

  - path: ../aether/weaver.yaml
    tags: [platform, aether]

  - path: ../vortex/weaver.yaml
    tags: [platform, vortex]

workspace: .

repositories:
  # Mantle metarepo root
  mantle:
    url: git@github.com:omnidotdev/mantle.git
    path: .
    tags: [product, metarepo]

  # Mantle product services
  mantle-api:
    url: git@github.com:omnidotdev/mantle-api.git
    path: ./services/mantle-api
    tags: [product, backend]

  mantle-app:
    url: git@github.com:omnidotdev/mantle-app.git
    path: ./services/mantle-app
    tags: [product, frontend]
